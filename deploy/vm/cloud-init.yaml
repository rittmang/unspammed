#cloud-config
# Template for a fresh Ubuntu/Debian VM that supports cloud-init user data.
# Replace the repository URL first. Never put application secrets in user data.
# This prepares the checkout; installation starts after you SSH in and edit app.env.
package_update: true
packages:
  - git
  - curl
runcmd:
  - [
      sh,
      -ec,
      'test -d /opt/watchtower/.git || git clone YOUR_FORK_OR_CLONE_URL /opt/watchtower;
      umask 077;
      test -e /opt/watchtower/app.env || cp /opt/watchtower/deploy/vm/app.env.example /opt/watchtower/app.env;
      echo "SSH in, edit /opt/watchtower/app.env, then run: sudo sh /opt/watchtower/deploy/vm/install.sh"',
    ]
