#cloud-config
# Template for a fresh Ubuntu/Debian VM that supports cloud-init user data.
# Replace the repository URL first. Never put application secrets in user data.
# This prepares the checkout; installation starts after you SSH in and edit app.env.
package_update: true
packages:
  - git
  - curl
runcmd:
  - [
      sh,
      -ec,
      'test -d /opt/unspammed/.git || git clone YOUR_FORK_OR_CLONE_URL /opt/unspammed;
      umask 077;
      test -e /opt/unspammed/app.env || cp /opt/unspammed/deploy/vm/app.env.example /opt/unspammed/app.env;
      echo "SSH in, edit /opt/unspammed/app.env, then run: sudo sh /opt/unspammed/deploy/vm/install.sh"',
    ]
