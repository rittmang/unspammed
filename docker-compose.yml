# Watchtower on any Docker host: a VM, Coolify, or your own server.
# External PostgreSQL is the default. Add --profile bundled-db for a
# PostgreSQL container on the same host, and --profile https for
# automatic HTTPS with Caddy. See docs/setup.md, section 5G.
services:
  watchtower:
    build: .
    restart: unless-stopped
    env_file:
      - .watchtower/runtime.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'
    ports:
      - '${WATCHTOWER_PORT:-3000}:3000'
    depends_on: []

  db:
    profiles: ['bundled-db']
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: watchtower
    volumes:
      - watchtower-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchtower']
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    profiles: ['https']
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WATCHTOWER_DOMAIN: ${WATCHTOWER_DOMAIN:?Set WATCHTOWER_DOMAIN to your domain}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    command: caddy reverse-proxy --from {$WATCHTOWER_DOMAIN} --to watchtower:3000
    depends_on:
      - watchtower

volumes:
  watchtower-db:
  caddy-data:
  caddy-config:
